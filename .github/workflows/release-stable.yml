name: Release (Stable)

on:
  push:
    tags:
      - 'stable-v*'

concurrency:
  group: release-stable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    name: Compute stable version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      display_version: ${{ steps.ver.outputs.display_version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - id: ver
        shell: bash
        run: |
          python3 <<'PY' > version.env
          import os
          import re
          from datetime import date

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("stable-v")
          match = re.fullmatch(r"(\d{4})\.(\d{1,2})\.(\d{1,2})", version)
          if not match:
              raise SystemExit(f"Stable tags must use stable-vYYYY.M.D, got {tag}")

          date(*map(int, match.groups()))
          print(f"version={version}")
          print(f"display_version={version}")
          print(f"tag={tag}")
          PY

          cat version.env >> "$GITHUB_OUTPUT"
          DISPLAY_VERSION=$(grep '^display_version=' version.env | cut -d= -f2-)
          echo "### Stable version: \`$DISPLAY_VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build web app
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ needs.version.outputs.version }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: pnpm build

      - name: Package web build
        run: |
          cd dist
          zip -r ../artemis-web-${{ needs.version.outputs.version }}.zip .

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemis-web-${{ needs.version.outputs.version }}
          path: artemis-web-${{ needs.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release (stable)
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: artemis-web-${{ needs.version.outputs.version }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Artemis ${{ needs.version.outputs.display_version }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: artemis-web-${{ needs.version.outputs.version }}.zip
